<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survei Karakteristik Murid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; }
        .form-container { max-width: 800px; margin: auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .section-title { background: #e5e7eb; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; margin-top: 1.5rem; }
        .field-group { margin-top: 1rem; }
        label { font-weight: 500; display: block; margin-bottom: 0.25rem; }
        input, select, textarea { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.5rem; }
        .radio-group { display: flex; flex-wrap: wrap; gap: 1rem; }
        .radio-group label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .checkbox-group label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; }
        button { background: #2563eb; color: white; padding: 0.75rem 2rem; border-radius: 0.5rem; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        #result { margin-top: 1.5rem; }
    </style>
</head>
<body>
<div class="form-container">
    <h1 class="text-2xl font-bold text-center text-blue-700">Survei Karakteristik Murid</h1>
    <p class="text-center text-sm text-gray-600">Isi sesuai dengan kondisi dan pengalamanmu.</p>
    <hr class="my-4">

    <form id="surveyForm">

        <!-- ========== A. LATAR BELAKANG PERSONAL ========== -->
        <div class="section-title">A. Latar Belakang Personal</div>

        <div class="field-group">
            <label>Nama Lengkap <span class="text-red-500">*</span></label>
            <input type="text" name="namaLengkap" required>
        </div>
        <div class="field-group">
            <label>NISN</label>
            <input type="text" name="nisn">
        </div>
        <div class="field-group">
            <label>Kelas/Jurusan <span class="text-red-500">*</span></label>
            <input type="text" name="kelasJurusan" required>
        </div>
        <div class="field-group">
            <label>Program Keahlian / Konsentrasi <span class="text-red-500">*</span></label>
            <input type="text" name="programKeahlian" required>
        </div>

        <!-- Disabilitas -->
        <div class="field-group">
            <label>Apakah kamu memiliki disabilitas/kebutuhan khusus?</label>
            <div class="radio-group">
                <label><input type="radio" name="disabilitas" value="Tidak"> Tidak</label>
                <label><input type="radio" name="disabilitas" value="Hambatan Penglihatan"> Hambatan Penglihatan</label>
                <label><input type="radio" name="disabilitas" value="Hambatan Pendengaran"> Hambatan Pendengaran</label>
                <label><input type="radio" name="disabilitas" value="Hambatan Intelektual"> Hambatan Intelektual</label>
                <label><input type="radio" name="disabilitas" value="Hambatan Fisik Motorik"> Hambatan Fisik Motorik</label>
                <label><input type="radio" name="disabilitas" value="Hambatan Mental (Emosi dan Perilaku)"> Hambatan Mental</label>
                <label><input type="radio" name="disabilitas" value="Hambatan Komunikasi, Interaksi, dan Perilaku (Autisme)"> Autisme</label>
                <label><input type="radio" name="disabilitas" value="ADHD"> ADHD</label>
                <label><input type="radio" name="disabilitas" value="Sindrome Down"> Sindrome Down</label>
                <label><input type="radio" name="disabilitas" value="Slow Learner"> Slow Learner</label>
                <label><input type="radio" name="disabilitas" value="Kesulitan Belajar Spesifik"> Kesulitan Belajar Spesifik</label>
                <label><input type="radio" name="disabilitas" value="Cerdas Istimewa/Bakat Istimewa"> Cerdas Istimewa/Bakat Istimewa</label>
            </div>
        </div>
        <div class="field-group">
            <label>Jika disabilitas, jelaskan detail (opsional)</label>
            <input type="text" name="disabilitasDetail">
        </div>

        <div class="field-group">
            <label>Nomor HP yang dapat dihubungi</label>
            <input type="text" name="nomorHp">
        </div>
        <div class="field-group">
            <label>Asal Sekolah SMP/MTs/sederajat</label>
            <input type="text" name="asalSekolah">
        </div>
        <div class="field-group">
            <label>Tahun Lulus SMP/MTs/sederajat</label>
            <input type="text" name="tahunLulus">
        </div>
        <div class="field-group">
            <label>Bahasa yang paling sering digunakan di rumah</label>
            <div class="radio-group">
                <label><input type="radio" name="bahasaRumah" value="Bahasa Indonesia"> Bahasa Indonesia</label>
                <label><input type="radio" name="bahasaRumah" value="Bahasa daerah"> Bahasa daerah</label>
                <label><input type="radio" name="bahasaRumah" value="Bahasa asing"> Bahasa asing</label>
                <label><input type="radio" name="bahasaRumah" value="Campuran"> Campuran</label>
                <label><input type="radio" name="bahasaRumah" value="Lainnya"> Lainnya</label>
            </div>
        </div>

        <!-- ========== B. AKADEMIK ========== -->
        <div class="section-title">B. Akademik</div>

        <div class="field-group">
            <label>Apakah program keahlian yang kamu pilih sesuai dengan minatmu?</label>
            <div class="radio-group">
                <label><input type="radio" name="programKeahlianSesuai" value="Ya"> Ya</label>
                <label><input type="radio" name="programKeahlianSesuai" value="Tidak"> Tidak</label>
                <label><input type="radio" name="programKeahlianSesuai" value="Belum tahu"> Belum tahu</label>
            </div>
        </div>

        <div class="field-group">
            <label>Alasan memilih program keahlian ini</label>
            <div class="radio-group">
                <label><input type="radio" name="alasanPilihJurusan" value="Keinginan sendiri"> Keinginan sendiri</label>
                <label><input type="radio" name="alasanPilihJurusan" value="Saran orang tua/wali"> Saran orang tua/wali</label>
                <label><input type="radio" name="alasanPilihJurusan" value="Saran guru/sekolah sebelumnya"> Saran guru/sekolah sebelumnya</label>
                <label><input type="radio" name="alasanPilihJurusan" value="Peluang kerja"> Peluang kerja</label>
                <label><input type="radio" name="alasanPilihJurusan" value="Ikut teman"> Ikut teman</label>
                <label><input type="radio" name="alasanPilihJurusan" value="Belum memiliki pilihan yang jelas"> Belum memiliki pilihan yang jelas</label>
                <label><input type="radio" name="alasanPilihJurusan" value="Lainnya"> Lainnya</label>
            </div>
            <input type="text" name="alasanPilihJurusanLainnya" placeholder="Jika Lainnya, sebutkan..." class="mt-2">
        </div>

        <div class="field-group">
            <label>Bagaimana perasaanmu diterima di sekolah ini?</label>
            <div class="radio-group">
                <label><input type="radio" name="perasaanDiterima" value="Senang"> Senang</label>
                <label><input type="radio" name="perasaanDiterima" value="Cukup senang"> Cukup senang</label>
                <label><input type="radio" name="perasaanDiterima" value="Biasa saja"> Biasa saja</label>
                <label><input type="radio" name="perasaanDiterima" value="Masih ragu"> Masih ragu</label>
                <label><input type="radio" name="perasaanDiterima" value="Terpaksa"> Terpaksa</label>
            </div>
        </div>

        <div class="field-group">
            <label>Mata pelajaran yang paling kamu senangi (maksimal 5, beserta alasannya)</label>
            <textarea name="mapelFavorit" rows="2"></textarea>
        </div>
        <div class="field-group">
            <label>Mata pelajaran yang paling menantang/sulit (maksimal 5, beserta alasannya)</label>
            <textarea name="mapelSulit" rows="2"></textarea>
        </div>
        <div class="field-group">
            <label>Bakat atau keahlian menonjol yang kamu miliki</label>
            <input type="text" name="bakatKeahlian">
        </div>
        <div class="field-group">
            <label>Pengalaman kegiatan, lomba, organisasi, proyek, atau karya yang pernah diikuti/dibuat</label>
            <textarea name="pengalamanKegiatan" rows="2"></textarea>
        </div>
        <div class="field-group">
            <label>Ekstrakurikuler atau kegiatan sekolah yang kamu minati</label>
            <input type="text" name="ekstrakurikuler">
        </div>
        <div class="field-group">
            <label>Kebiasaan belajar di luar jam sekolah</label>
            <div class="radio-group">
                <label><input type="radio" name="kebiasaanBelajar" value="Belajar mandiri"> Belajar mandiri</label>
                <label><input type="radio" name="kebiasaanBelajar" value="Belajar bersama teman"> Belajar bersama teman</label>
                <label><input type="radio" name="kebiasaanBelajar" value="Didampingi orang tua/wali"> Didampingi orang tua/wali</label>
                <label><input type="radio" name="kebiasaanBelajar" value="Mengikuti bimbingan belajar/les"> Mengikuti bimbingan belajar/les</label>
                <label><input type="radio" name="kebiasaanBelajar" value="Belajar melalui internet/video"> Belajar melalui internet/video</label>
                <label><input type="radio" name="kebiasaanBelajar" value="Belajar hanya saat ada tugas/ujian"> Belajar hanya saat ada tugas/ujian</label>
                <label><input type="radio" name="kebiasaanBelajar" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Rata-rata waktu belajar di luar jam sekolah</label>
            <div class="radio-group">
                <label><input type="radio" name="lamaBelajar" value="Tidak ada"> Tidak ada</label>
                <label><input type="radio" name="lamaBelajar" value="Kurang dari 30 menit"> < 30 menit</label>
                <label><input type="radio" name="lamaBelajar" value="31–60 menit"> 31–60 menit</label>
                <label><input type="radio" name="lamaBelajar" value="60–90 menit"> 60–90 menit</label>
                <label><input type="radio" name="lamaBelajar" value="Lebih dari 90 menit"> > 90 menit</label>
            </div>
        </div>
        <div class="field-group">
            <label>Cara belajar yang paling efektif membantumu memahami materi</label>
            <div class="radio-group">
                <label><input type="radio" name="caraBelajarEfektif" value="Mendengarkan penjelasan"> Mendengarkan penjelasan</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Membaca materi"> Membaca materi</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Melihat contoh/gambar/video"> Melihat contoh/gambar/video</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Praktik langsung"> Praktik langsung</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Diskusi dengan teman"> Diskusi dengan teman</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Dibimbing guru/orang lain"> Dibimbing guru/orang lain</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Membuat catatan/rangkuman"> Membuat catatan/rangkuman</label>
                <label><input type="radio" name="caraBelajarEfektif" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Hal yang biasanya menyulitkanmu saat mengikuti pembelajaran</label>
            <div class="radio-group">
                <label><input type="radio" name="kesulitanBelajar" value="Memahami bacaan"> Memahami bacaan</label>
                <label><input type="radio" name="kesulitanBelajar" value="Memahami penjelasan lisan"> Memahami penjelasan lisan</label>
                <label><input type="radio" name="kesulitanBelajar" value="Mencatat materi"> Mencatat materi</label>
                <label><input type="radio" name="kesulitanBelajar" value="Menghitung/matematika"> Menghitung/matematika</label>
                <label><input type="radio" name="kesulitanBelajar" value="Menggunakan komputer/perangkat digital"> Menggunakan komputer/perangkat digital</label>
                <label><input type="radio" name="kesulitanBelajar" value="Mengerjakan tugas tepat waktu"> Mengerjakan tugas tepat waktu</label>
                <label><input type="radio" name="kesulitanBelajar" value="Memusatkan perhatian pada pelajaran"> Memusatkan perhatian</label>
                <label><input type="radio" name="kesulitanBelajar" value="Berbicara/presentasi di depan kelas"> Berbicara/presentasi</label>
                <label><input type="radio" name="kesulitanBelajar" value="Bekerja dalam kelompok"> Bekerja dalam kelompok</label>
                <label><input type="radio" name="kesulitanBelajar" value="Mengatur waktu belajar"> Mengatur waktu belajar</label>
                <label><input type="radio" name="kesulitanBelajar" value="Tidak ada"> Tidak ada</label>
                <label><input type="radio" name="kesulitanBelajar" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Apakah kamu biasanya memerlukan bantuan tambahan untuk memahami materi?</label>
            <div class="radio-group">
                <label><input type="radio" name="membutuhkanBantuan" value="Tidak"> Tidak</label>
                <label><input type="radio" name="membutuhkanBantuan" value="Kadang-kadang"> Kadang-kadang</label>
                <label><input type="radio" name="membutuhkanBantuan" value="Sering"> Sering</label>
                <label><input type="radio" name="membutuhkanBantuan" value="Hampir selalu"> Hampir selalu</label>
            </div>
        </div>
        <div class="field-group">
            <label>Bantuan seperti apa yang paling kamu perlukan jika membutuhkan?</label>
            <div class="radio-group">
                <label><input type="radio" name="jenisBantuan" value="Tidak memerlukan bantuan"> Tidak memerlukan</label>
                <label><input type="radio" name="jenisBantuan" value="Penjelasan ulang dari guru"> Penjelasan ulang dari guru</label>
                <label><input type="radio" name="jenisBantuan" value="Contoh soal/praktik tambahan"> Contoh soal/praktik tambahan</label>
                <label><input type="radio" name="jenisBantuan" value="Pendampingan teman sebaya"> Pendampingan teman sebaya</label>
                <label><input type="radio" name="jenisBantuan" value="Bimbingan konseling"> Bimbingan konseling</label>
                <label><input type="radio" name="jenisBantuan" value="Materi tertulis/video"> Materi tertulis/video</label>
                <label><input type="radio" name="jenisBantuan" value="Waktu belajar tambahan"> Waktu belajar tambahan</label>
                <label><input type="radio" name="jenisBantuan" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Apakah kamu memiliki tempat belajar yang cukup nyaman di rumah/tempat tinggal?</label>
            <div class="radio-group">
                <label><input type="radio" name="tempatBelajarNyaman" value="Ya"> Ya</label>
                <label><input type="radio" name="tempatBelajarNyaman" value="Sebagian"> Sebagian</label>
                <label><input type="radio" name="tempatBelajarNyaman" value="Tidak"> Tidak</label>
            </div>
        </div>
        <div class="field-group">
            <label>Apakah kamu memiliki akses perangkat dan internet yang cukup?</label>
            <div class="radio-group">
                <label><input type="radio" name="aksesPerangkatInternet" value="Perangkat dan internet tersedia memadai"> Perangkat dan internet memadai</label>
                <label><input type="radio" name="aksesPerangkatInternet" value="Perangkat tersedia tetapi internet terbatas"> Perangkat tersedia, internet terbatas</label>
                <label><input type="radio" name="aksesPerangkatInternet" value="Internet tersedia tetapi perangkat terbatas"> Internet tersedia, perangkat terbatas</label>
                <label><input type="radio" name="aksesPerangkatInternet" value="Keduanya terbatas"> Keduanya terbatas</label>
                <label><input type="radio" name="aksesPerangkatInternet" value="Tidak ada"> Tidak ada</label>
                <label><input type="radio" name="aksesPerangkatInternet" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Rencana utama setelah lulus SMK</label>
            <div class="radio-group">
                <label><input type="radio" name="rencanaSetelahLulus" value="Bekerja"> Bekerja</label>
                <label><input type="radio" name="rencanaSetelahLulus" value="Kuliah"> Kuliah</label>
                <label><input type="radio" name="rencanaSetelahLulus" value="Wirausaha"> Wirausaha</label>
                <label><input type="radio" name="rencanaSetelahLulus" value="Magang dalam negeri"> Magang dalam negeri</label>
                <label><input type="radio" name="rencanaSetelahLulus" value="Magang luar negeri"> Magang luar negeri</label>
                <label><input type="radio" name="rencanaSetelahLulus" value="Belum tahu"> Belum tahu</label>
                <label><input type="radio" name="rencanaSetelahLulus" value="Lainnya"> Lainnya</label>
            </div>
            <input type="text" name="rencanaLainnya" placeholder="Jika Lainnya, sebutkan..." class="mt-2">
        </div>
        <div class="field-group">
            <label>Jenis pekerjaan/profesi impian (maksimal 5, beserta alasannya)</label>
            <textarea name="profesiImpian" rows="2"></textarea>
        </div>
        <div class="field-group">
            <label>Jika ingin kuliah, jurusan/program studi yang diminati dan alasannya</label>
            <textarea name="jurusanKuliah" rows="2"></textarea>
        </div>
        <div class="field-group">
            <label>Apakah kamu membutuhkan informasi atau bimbingan tentang pilihan karir, kuliah, magang, atau wirausaha?</label>
            <div class="radio-group">
                <label><input type="radio" name="butuhBimbinganKarir" value="Ya"> Ya</label>
                <label><input type="radio" name="butuhBimbinganKarir" value="Tidak"> Tidak</label>
                <label><input type="radio" name="butuhBimbinganKarir" value="Belum tahu"> Belum tahu</label>
            </div>
        </div>
        <div class="field-group">
            <label>Aplikasi atau media sosial yang paling sering digunakan sehari-hari</label>
            <div class="radio-group">
                <label><input type="radio" name="aplikasiSeringDigunakan" value="Tidak ada"> Tidak ada</label>
                <label><input type="radio" name="aplikasiSeringDigunakan" value="Aplikasi percakapan"> Aplikasi percakapan</label>
                <label><input type="radio" name="aplikasiSeringDigunakan" value="Media sosial"> Media sosial</label>
                <label><input type="radio" name="aplikasiSeringDigunakan" value="Game online"> Game online</label>
                <label><input type="radio" name="aplikasiSeringDigunakan" value="Streaming video/musik"> Streaming video/musik</label>
                <label><input type="radio" name="aplikasiSeringDigunakan" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Rata-rata waktu di depan layar (HP/Laptop/Gadget) di luar jam sekolah</label>
            <div class="radio-group">
                <label><input type="radio" name="lamaLayar" value="Kurang dari 1 jam"> < 1 jam</label>
                <label><input type="radio" name="lamaLayar" value="1–3 jam"> 1–3 jam</label>
                <label><input type="radio" name="lamaLayar" value="3–5 jam"> 3–5 jam</label>
                <label><input type="radio" name="lamaLayar" value="Lebih dari 5 jam sehari"> > 5 jam</label>
            </div>
        </div>
        <div class="field-group">
            <label>Apakah orang tua/wali memberikan aturan atau batasan dalam penggunaan HP?</label>
            <div class="radio-group">
                <label><input type="radio" name="aturanHp" value="Ya, sangat ketat (ada jam khusus)"> Ya, sangat ketat</label>
                <label><input type="radio" name="aturanHp" value="Ada aturan tapi kadang saya langgar"> Ada aturan, kadang dilanggar</label>
                <label><input type="radio" name="aturanHp" value="Tidak ada aturan sama sekali"> Tidak ada aturan</label>
            </div>
        </div>
        <div class="field-group">
            <label>Tantangan yang mungkin dirasakan untuk mencapai cita-cita (boleh pilih lebih dari satu)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="tantangan" value="Keuangan"> Keuangan</label>
                <label><input type="checkbox" name="tantangan" value="Transportasi"> Transportasi</label>
                <label><input type="checkbox" name="tantangan" value="Kemampuan belajar"> Kemampuan belajar</label>
                <label><input type="checkbox" name="tantangan" value="Kesehatan"> Kesehatan</label>
                <label><input type="checkbox" name="tantangan" value="Pergaulan"> Pergaulan</label>
                <label><input type="checkbox" name="tantangan" value="Hubungan keluarga di rumah"> Hubungan keluarga</label>
                <label><input type="checkbox" name="tantangan" value="Lainnya"> Lainnya</label>
            </div>
        </div>

        <!-- ========== C. KELUARGA ========== -->
        <div class="section-title">C. Keluarga</div>

        <div class="field-group">
            <label>Dengan siapa kamu tinggal saat ini?</label>
            <div class="radio-group">
                <label><input type="radio" name="tinggalBersama" value="Orang tua lengkap"> Orang tua lengkap</label>
                <label><input type="radio" name="tinggalBersama" value="Ayah saja"> Ayah saja</label>
                <label><input type="radio" name="tinggalBersama" value="Ibu saja"> Ibu saja</label>
                <label><input type="radio" name="tinggalBersama" value="Kakek/nenek"> Kakek/nenek</label>
                <label><input type="radio" name="tinggalBersama" value="Saudara"> Saudara</label>
                <label><input type="radio" name="tinggalBersama" value="Wali"> Wali</label>
                <label><input type="radio" name="tinggalBersama" value="Kos/kontrakan sendiri"> Kos/kontrakan sendiri</label>
                <label><input type="radio" name="tinggalBersama" value="Asrama"> Asrama</label>
                <label><input type="radio" name="tinggalBersama" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <div class="field-group">
            <label>Orang dewasa yang paling sering mendampingi atau memperhatikan kebutuhan sekolahmu</label>
            <div class="radio-group">
                <label><input type="radio" name="orangTuaPendamping" value="Ayah"> Ayah</label>
                <label><input type="radio" name="orangTuaPendamping" value="Ibu"> Ibu</label>
                <label><input type="radio" name="orangTuaPendamping" value="Ayah dan ibu"> Ayah dan ibu</label>
                <label><input type="radio" name="orangTuaPendamping" value="Kakek/nenek"> Kakek/nenek</label>
                <label><input type="radio" name="orangTuaPendamping" value="Kakak/saudara"> Kakak/saudara</label>
                <label><input type="radio" name="orangTuaPendamping" value="Wali/pengasuh"> Wali/pengasuh</label>

        // Untuk checkbox, ambil semua nilai yang terpilih (array)
        for (let [key, value] of formData.entries()) {
            if (key === 'tantangan' || key === 'fasilitasBelajar' || key === 'kemudahanPertemanan' || key === 'tantanganPertemanan') {
                if (!data[key]) data[key] = [];
                data[key].push(value);
            } else {
                // Jika ada field yang sama muncul (misal radio), ambil yang terakhir
                data[key] = value;
            }
        }

        // Konversi array menjadi string yang dipisahkan koma
        ['tantangan', 'fasilitasBelajar', 'kemudahanPertemanan', 'tantanganPertemanan'].forEach(key => {
            if (data[key] && Array.isArray(data[key])) {
                data[key] = data[key].join(', ');
            }
        });

        // Tambahkan field disabilitasDetail dan alergiDetail yang mungkin tidak terambil
        // Karena nama inputnya berbeda, kita ambil manual jika ada
        const disabilitasDetail = document.querySelector('input[name="disabilitasDetail"]')?.value || '';
        const alergiDetail = document.querySelector('input[name="alergiDetail"]')?.value || '';
        const kondisiKesehatanDetail = document.querySelector('input[name="kondisiKesehatanDetail"]')?.value || '';
        data.disabilitasDetail = disabilitasDetail;
        data.alergiDetail = alergiDetail;
        data.kondisiKesehatanDetail = kondisiKesehatanDetail;

        // Ubah ke JSON dan kirim
        const payload = { data };

        try {
            const response = await fetch(FORM_URL, {
                method: 'POST',
                mode: 'cors', // atau 'no-cors' jika tidak butuh response
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Gagal mengirim data');

            const result = await response.json();
            if (result.success) {
                document.getElementById('result').innerHTML = `
                    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mt-4">
                        <strong>Sukses!</strong> Data tersimpan.
                        <br><a href="${result.pdfUrl}" target="_blank" class="text-blue-600 underline">Lihat PDF yang tersimpan di Google Drive</a>
                    </div>
                `;
            } else {
                throw new Error(result.error || 'Terjadi kesalahan');
            }
        } catch (error) {
            document.getElementById('result').innerHTML = `
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mt-4">
                    <strong>Error:</strong> ${error.message}
                </div>
            `;
        }
    });
</script>

</body>
</html>
